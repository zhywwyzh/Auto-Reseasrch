<text x="1304" y="365" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">反证 · 强基线 · 留出复验</text>
<text x="1304" y="398" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">通过 / 失败 / 未决</text>
<path d="M1550,335 L1569,335" fill="none" stroke="#146269" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1580" y="235" width="260" height="200" rx="8" fill="#ffffff" stroke="#ccd9d5" stroke-width="1.5"/>
<text x="1604" y="271" font-size="17" fill="#50656a" font-weight="500" text-anchor="start">06</text>
<text x="1604" y="317" font-size="27" fill="#16373c" font-weight="600" text-anchor="start">结论与交付</text>
<text x="1604" y="365" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">只写证据支持的主张</text>
<text x="1604" y="398" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">报告 · 稿件 · 负结果</text>
<path d="M210,535 L210,448" fill="none" stroke="#146269" stroke-width="2.5" marker-end="url(#arrow)"/>
