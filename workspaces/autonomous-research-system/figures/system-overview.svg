<text x="844" y="707" font-size="24" fill="#16373c" font-weight="500" text-anchor="start">决策反证</text>
<path d="M1072,682 L1072,716" stroke="#ccd9d5" stroke-width="2"/>
<text x="1088" y="707" font-size="24" fill="#16373c" font-weight="500" text-anchor="start">实验经历</text>
