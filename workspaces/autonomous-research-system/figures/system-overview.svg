<text x="1332" y="707" font-size="24" fill="#16373c" font-weight="500" text-anchor="start">方法经验</text>
<path d="M1560,682 L1560,716" stroke="#ccd9d5" stroke-width="2"/>
<text x="1576" y="707" font-size="24" fill="#16373c" font-weight="500" text-anchor="start">会话交接</text>
<text x="80" y="806" font-size="18" fill="#146269" font-weight="600" text-anchor="start">支撑长期运行的三项机制</text>
<path d="M80,826 L630,826" stroke="#ccd9d5" stroke-width="2"/>
<text x="80" y="866" font-size="26" fill="#146269" font-weight="600" text-anchor="start">方向保持</text>
<text x="80" y="909" font-size="21" fill="#50656a" font-weight="400" text-anchor="start">目标与不可改条件每轮必读</text>
<text x="80" y="943" font-size="21" fill="#50656a" font-weight="400" text-anchor="start">路线变化必须保留依据</text>
<path d="M680,826 L1230,826" stroke="#ccd9d5" stroke-width="2"/>
<text x="680" y="866" font-size="26" fill="#146269" font-weight="600" text-anchor="start">执行恢复</text>
<text x="680" y="909" font-size="21" fill="#50656a" font-weight="400" text-anchor="start">显式任务与作业身份，先核对再重试</text>
<text x="680" y="943" font-size="21" fill="#50656a" font-weight="400" text-anchor="start">预算预留、断路与检查点</text>
<path d="M1280,826 L1830,826" stroke="#ccd9d5" stroke-width="2"/>
<text x="1280" y="866" font-size="26" fill="#146269" font-weight="600" text-anchor="start">课题隔离</text>
<text x="1280" y="909" font-size="21" fill="#50656a" font-weight="400" text-anchor="start">TR-001 / TR-002 / TR-003 分别管理</text>
<text x="1280" y="943" font-size="21" fill="#50656a" font-weight="400" text-anchor="start">结果、环境、授权不串用</text>
<path d="M80,985 L1840,985" stroke="#ccd9d5" stroke-width="1.5"/>
<text x="80" y="1025" font-size="24" fill="#16373c" font-weight="600" text-anchor="start">长期持续的是研究状态与证据链，而不是一条永不结束的对话。</text>
<text x="80" y="1061" font-size="16" fill="#50656a" font-weight="400" text-anchor="start">ARS-DESIGN-001 · 2026-11-11 · 模块与流程均为设计；方法来源与证据边界见配套HTML说明。</text>
