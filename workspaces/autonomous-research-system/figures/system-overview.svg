<text x="532" y="493" font-size="19" fill="#146269" font-weight="400" text-anchor="start">按任务读取</text>
<path d="M1410,448 L1410,535" fill="none" stroke="#146269" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1432" y="493" font-size="19" fill="#146269" font-weight="400" text-anchor="start">验收与结论入账</text>
