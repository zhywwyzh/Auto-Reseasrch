<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">长期全自动研究系统：记得方向，能够恢复</title><desc id="desc">六步研究闭环连接持久研究记忆，由方向保持、执行恢复和课题隔离共同支撑。设计方案，未部署。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#146269" stroke-width="1.8"/></marker></defs>
<rect width="1920" height="1080" fill="#f7f8f4"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="80" y="90" font-size="42" fill="#16373c" font-weight="700" text-anchor="start">长期全自动研究系统：记得方向，能够恢复</text>
<text x="80" y="139" font-size="23" fill="#50656a" font-weight="400" text-anchor="start">以持久研究状态为中心，让短会话接力推进长期课题</text>
