<text x="112" y="599" font-size="29" fill="#146269" font-weight="600" text-anchor="start">持久研究状态与类型化记忆</text>
<text x="112" y="642" font-size="22" fill="#50656a" font-weight="400" text-anchor="start">会话可以结束、压缩或更换，研究状态与证据持续保留</text>
