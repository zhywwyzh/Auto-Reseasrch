<text x="80" y="207" font-size="18" fill="#146269" font-weight="600" text-anchor="start">研究任务闭环</text>
<rect x="80" y="235" width="260" height="200" rx="8" fill="#ffffff" stroke="#ccd9d5" stroke-width="1.5"/>
<text x="104" y="271" font-size="17" fill="#50656a" font-weight="500" text-anchor="start">01</text>
<text x="104" y="317" font-size="27" fill="#16373c" font-weight="600" text-anchor="start">契约与调度</text>
<text x="104" y="365" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">固定目标、阶段与预算</text>
<text x="104" y="398" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">分配有判别价值的任务</text>
<path d="M350,335 L369,335" fill="none" stroke="#146269" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="380" y="235" width="260" height="200" rx="8" fill="#ffffff" stroke="#ccd9d5" stroke-width="1.5"/>
<text x="404" y="271" font-size="17" fill="#50656a" font-weight="500" text-anchor="start">02</text>
<text x="404" y="317" font-size="27" fill="#16373c" font-weight="600" text-anchor="start">上下文组装</text>
<text x="404" y="365" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">必读约束 + 当前状态</text>
<text x="404" y="398" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">相关证据 + 正负经验</text>
<path d="M650,335 L669,335" fill="none" stroke="#146269" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="680" y="235" width="260" height="200" rx="8" fill="#146269" stroke="#146269" stroke-width="1.5"/>
<text x="704" y="271" font-size="17" fill="#c6e5e0" font-weight="500" text-anchor="start">03</text>
<text x="704" y="317" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Codex 短会话</text>
<text x="704" y="365" font-size="19" fill="#e2f2ee" font-weight="400" text-anchor="start">检索 · 推导 · 实现</text>
<text x="704" y="398" font-size="19" fill="#e2f2ee" font-weight="400" text-anchor="start">提交结构化任务产物</text>
<path d="M950,335 L969,335" fill="none" stroke="#146269" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="980" y="235" width="260" height="200" rx="8" fill="#ffffff" stroke="#ccd9d5" stroke-width="1.5"/>
<text x="1004" y="271" font-size="17" fill="#50656a" font-weight="500" text-anchor="start">04</text>
<text x="1004" y="317" font-size="27" fill="#16373c" font-weight="600" text-anchor="start">工具与实验</text>
<text x="1004" y="365" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">容器 / 作业 / 原始回执</text>
<text x="1004" y="398" font-size="19" fill="#50656a" font-weight="400" text-anchor="start">配置、数据、成本留痕</text>
<path d="M1250,335 L1269,335" fill="none" stroke="#146269" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1280" y="235" width="260" height="200" rx="8" fill="#ffffff" stroke="#ccd9d5" stroke-width="1.5"/>
