<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>自动研究智能体 · 操作台</title><style>
:root{--bg:#f4f5f1;--ink:#16373c;--muted:#52646b;--line:#d2dcd9;--accent:#146269}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,sans-serif;overflow-wrap:anywhere}header,main{max-width:1400px;margin:auto;padding:28px}header{border-bottom:1px solid var(--line)}h1{font-size:29px;margin:8px 0}h2{font-size:21px;margin:0 0 14px}h3{font-size:17px}a{color:var(--accent)}p{margin:8px 0}.sub,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:32px}section{margin-bottom:28px}.panel{padding:20px;border:1px solid var(--line);background:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:10px 0 5px;font-size:13px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:3px;padding:9px 11px;max-width:100%}input,select,textarea{width:100%;background:#fff;color:var(--ink)}textarea{resize:vertical}button{background:#fff;color:var(--accent);cursor:pointer}button.primary{background:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.notice{padding:12px 16px;background:#e5eeea;border-left:3px solid var(--accent);margin-top:14px;font-size:13px}.run{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.run.active{border-left:3px solid var(--accent);padding-left:10px}.run button{border:0;background:none;text-align:left;padding:0;width:100%;color:var(--ink)}.run small{display:block;color:var(--muted)}.stats{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0}.stats strong{font-size:24px;display:block}.stats span{font-size:12px;color:var(--muted)}pre{font:13px/1.8 ui-monospace,monospace;white-space:pre-wrap;margin:0;max-height:640px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.scroll{overflow:auto}.error{color:#9a3027}.badge{padding:3px 8px;background:#e5eeea;border-radius:3px;font-size:12px}#message{position:sticky;top:0;z-index:2;padding:10px 16px;background:var(--ink);color:#fff;display:none}.memory{padding:12px 0;border-bottom:1px solid var(--line)}.memory small{color:var(--muted)}details{margin:16px 0}summary{cursor:pointer;color:var(--accent)}@media(max-width:850px){.layout{grid-template-columns:1fr}header,main{padding:20px}.stats{gap:18px}h1{font-size:25px}}
</style></head><body><div id="message" role="status"></div><header><p class="sub">ARS v0.1 · 可运行的只读研究智能体</p><h1>自动研究智能体操作台</h1><p>输入目标 → 自动拆分任务 → 调用执行器 → 核对来源 → 批判与补充 → 生成报告。记忆和任务状态保存在本地。</p><p><a href="index.html">系统设计与汇报图</a> · <a href="README.md">使用说明与限制</a></p><div class="notice">Codex执行器会使用当前已登录账号的模型配额。模拟执行器只验证程序流程。当前版本不提供训练、仿真作业或论文投稿；源文件按只读沙箱处理，报告与记忆由控制器保存。网页仅供当前电脑使用。</div></header>
<main class="layout"><aside><section class="panel"><h2>创建研究任务</h2><form id="create-form"><label for="topic">课题</label><select id="topic"><option value="ARS-DEMO">ARS-DEMO · 独立程序验证</option><option>TR-001</option><option>TR-002</option><option>TR-003</option></select><label for="goal">研究目标</label><textarea id="goal" rows="4" required placeholder="写出要解决的问题和预期交付"></textarea><label for="backend">执行器</label><select id="backend"><option value="codex">Codex · 真实模型调用</option><option value="mock">模拟 · 不调用模型</option></select><div class="fields"><div><label for="max-calls">调用总上限</label><input id="max-calls" type="number" min="1" max="1000" value="8" required></div><div><label for="max-seconds">累计运行秒数</label><input id="max-seconds" type="number" min="5" max="604800" value="3600" required></div></div><label for="max-tokens">token派发阈值</label><input id="max-tokens" type="number" min="1" value="400000" required><label for="model">模型（留空使用本机配置）</label><input id="model" autocomplete="off"><label><input id="import-history" type="checkbox" checked style="width:auto"> 导入已登记课题历史为待核对记忆</label><div class="actions"><button type="submit" class="primary">创建任务</button></div></form></section><section><h2>已有运行</h2><div id="campaigns"></div></section></aside>
<div id="workspace"><p class="muted">选择已有运行，或创建研究任务。创建后点击“启动”才会调用执行器。</p></div></main>
<template id="detail-template"><section class="panel"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2 id="run-title" style="margin:0"></h2><span id="run-status" class="badge"></span></div><p id="run-goal"></p><p id="run-reason" class="muted"></p><div class="stats"><div><strong id="calls"></strong><span>已占用调用配额 / 上限</span></div><div><strong id="tokens"></strong><span>已观测输入+输出token</span></div><div><strong id="memory-count"></strong><span>持久记忆条目</span></div></div><p class="muted" id="run-path"></p><div class="actions"><button id="start" class="primary">启动</button><button id="stop">停止</button><button id="resume">继续 / 恢复</button><button id="history">导入历史</button><button id="download">下载报告</button></div><p class="muted" style="font-size:12px">调用在派发前占用配额，失败或未知结果也保留。token阈值在回执后阻止下一次派发；单次调用可能越过阈值。金额未知，不显示虚构费用。</p></section><section><h2>任务队列</h2><div class="scroll"><table><thead><tr><th>阶段</th><th>任务</th><th>状态</th><th>尝试</th></tr></thead><tbody id="tasks"></tbody></table></div></section><section class="panel"><h2>阶段报告</h2><pre id="report"></pre></section><details><summary>补充任务或资料线索</summary><form id="add-form"><label for="task-title">任务标题</label><input id="task-title" required><label for="task-instruction">补充说明</label><textarea id="task-instruction" rows="3" required></textarea><div class="actions"><button>保存补充任务</button></div></form></details><details><summary>持久记忆（最近25项）</summary><div id="memories"></div></details><details><summary>运行事件（最近30项）</summary><pre id="events"></pre></details></template>
<script>
let token='',selected=localStorage.getItem('ars-selected')||'',inflight=false;const $=id=>document.getElementById(id);const labels={READY:'就绪',RUNNING:'运行中',COMPLETED:'本轮流程完成',STOPPED_USER:'已停止',STOPPED_BUDGET:'预算上限',WAITING_EXTERNAL:'等待补充',NEEDS_RECONCILIATION:'调用状态待核对'};
function message(text,error=false){$('message').textContent=text;$('message').style.display='block';$('message').style.background=error?'#9a3027':'#16373c';clearTimeout(message.timer);message.timer=setTimeout(()=>{$('message').style.display='none'},6500)}
async function api(path,data){const r=await fetch('/api/agent/'+path,data?{method:'POST',headers:{'Content-Type':'application/json','X-ARS-Token':token},body:JSON.stringify(data)}:{});const out=await r.json();if(!r.ok)throw Error(out.error||r.status);return out}
function text(id,value){$(id).textContent=value}
async function act(action){try{await api(action,{key:selected});message(action==='stop'?'已记录停止请求':'操作已提交');await refresh()}catch(e){message(e.message,true)}}
function mount(){const w=$('workspace');w.replaceChildren($('detail-template').content.cloneNode(true));for(const action of ['start','stop','resume'])$(action).onclick=()=>act(action);$('history').onclick=()=>act('import-history');$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([$('report').textContent],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=selected.split('/').pop()+'-report.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('add-form').onsubmit=async e=>{e.preventDefault();try{await api('add',{key:selected,title:$('task-title').value,instruction:$('task-instruction').value});e.target.reset();message('已保存补充任务');await refresh()}catch(err){message(err.message,true)}}}
async function refresh(){if(inflight)return;inflight=true;try{const list=await api('campaigns');token=list.token;const box=$('campaigns');box.replaceChildren();for(const c of list.campaigns){const row=document.createElement('div');row.className='run'+(selected===c.key?' active':'');const button=document.createElement('button');button.type='button';button.textContent=c.topic+' · '+c.id;const small=document.createElement('small');small.textContent=(labels[c.status]||c.status)+' · '+c.backend;row.append(button,small);button.onclick=async()=>{selected=c.key;localStorage.setItem('ars-selected',selected);mount();await refresh()};box.append(row)}if(selected){const s=await api('state?key='+encodeURIComponent(selected));text('run-title',s.topic+' / '+s.id);text('run-status',labels[s.status]||s.status);text('run-goal',s.goal);text('run-reason',s.reason);text('calls',s.calls+' / '+s.config.max_calls);text('tokens',s.tokens);text('memory-count',s.memory_count);text('run-path','本地运行目录：'+s.directory);text('report',s.report);$('start').disabled=s.status!=='READY'&&s.status!=='RUNNING';$('resume').disabled=s.status==='RUNNING'||s.status==='READY';$('stop').disabled=s.status==='COMPLETED'||s.status==='STOPPED_USER';const rows=s.tasks.map(t=>{const tr=document.createElement('tr');for(const value of [t.phase,t.title,t.status,t.attempt]){const td=document.createElement('td');td.textContent=value;tr.append(td)}return tr});$('tasks').replaceChildren(...rows);$('memories').replaceChildren(...s.memories.map(m=>{const div=document.createElement('div');div.className='memory';const meta=document.createElement('small');meta.textContent=m.kind+' / '+m.status;const p=document.createElement('p');p.textContent=m.text;div.append(meta,p);return div}));text('events',s.events.map(e=>e.seq+' '+e.created_at+' '+e.type+'\n'+e.payload).join('\n\n'));}}catch(e){message(e.message,true)}finally{inflight=false}}
$('create-form').onsubmit=async e=>{e.preventDefault();try{const out=await api('create',{topic:$('topic').value,goal:$('goal').value,backend:$('backend').value,max_calls:Number($('max-calls').value),max_seconds:Number($('max-seconds').value),max_tokens:Number($('max-tokens').value),model:$('model').value,import_history:$('import-history').checked});selected=out.key;localStorage.setItem('ars-selected',selected);mount();message('已创建；点击启动开始执行');await refresh()}catch(err){message(err.message,true)}};
if(selected)mount();refresh();setInterval(refresh,2000);
</script></body></html>
